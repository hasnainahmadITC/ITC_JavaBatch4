spring:
  application:
    name: connectionservice
  server:
    port:8080
  datasource:
    url: jdbc:h2:mem:connectionservice
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
